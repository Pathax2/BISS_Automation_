<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Framework Architecture Walkthrough</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  @property --c { syntax: '<color>'; inherits: true; initial-value: #16407A; }
  :root {
    --bg: #070D1B;
    --panel: rgba(15, 23, 42, 0.62);
    --line: rgba(255, 255, 255, 0.09);
    --ink: #F1F5FB;
    --muted: #A9B8CF;
    --c: #16407A;
    --sw: min(calc(100vw - 32px), calc((100vh - 250px) * 1.7778));
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(1100px 620px at 12% -12%, rgba(34, 197, 94, 0.14), transparent 60%),
      radial-gradient(900px 620px at 100% 112%, rgba(59, 130, 246, 0.16), transparent 60%),
      var(--bg);
    color: var(--ink);
    font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    transition: --c 0.8s ease;
    overflow-x: hidden;
  }
  .app { min-height: 100vh; overflow-x: clip; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; }

  /* ---------- diagram card ---------- */
  .stage { position: relative; width: var(--sw); }
  .stage::before {
    content: ""; position: absolute; inset: -6% -4%; z-index: 0; pointer-events: none;
    background: radial-gradient(closest-side, color-mix(in srgb, var(--c) 45%, transparent), transparent 75%);
    filter: blur(40px); opacity: 0.55;
  }
  .card {
    position: relative; z-index: 1; border-radius: 18px; overflow: hidden;
    box-shadow: 0 40px 100px -24px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.08);
  }
  #dia { display: block; width: 100%; height: auto; }

  /* ---------- step states ---------- */
  #dia .step { transition: opacity 0.7s ease; }
  #dia .step.future { opacity: 0; pointer-events: none; }
  #dia .step.past { opacity: 0.26; }
  #dia .step.past:hover { opacity: 0.62; }
  #dia .step.current, #dia .step.shown { opacity: 1; }

  /* entry animations: replayed each time a step becomes current */
  #dia .step.current .ni { animation: rise 0.7s cubic-bezier(.2, .8, .2, 1) var(--d, 0s) both; }
  #dia .step.current .zone { transform-box: fill-box; transform-origin: center; animation: zin 0.65s ease-out 0.05s both; }
  #dia .step.current .draw { stroke-dasharray: 1; animation: draw 0.75s ease-out var(--d, 0s) both; }
  #dia .step.current .drawl { stroke-dasharray: 1; animation: drawl 0.75s ease-out var(--d, 0s) both; }
  #dia .step.current .fade, #dia .step.current .lbl, #dia .step.current .bul, #dia .step.current .pwbg { animation: fade 0.55s ease-out var(--d, 0.5s) both; }
  #dia .step.current .bp { transform-box: fill-box; transform-origin: center; animation: pop 0.6s cubic-bezier(.3, 1.7, .5, 1) var(--d, 0.3s) both; }
  #dia .step.current .zframe { animation: zglow 2.6s ease-in-out 1.1s infinite; }

  @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  @keyframes zin { from { opacity: 0; transform: scale(0.985); } to { opacity: 1; transform: none; } }
  @keyframes draw { 0% { stroke-dashoffset: 1; marker-end: none; } 88% { marker-end: none; } 89% { marker-end: url(#arr); } 100% { stroke-dashoffset: 0; marker-end: url(#arr); } }
  @keyframes drawl { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pop { 0% { opacity: 0; transform: scale(0.2); } 100% { opacity: 1; transform: scale(1); } }
  @keyframes zglow { 0%, 100% { stroke-opacity: 0.55; stroke-width: 1.4; fill-opacity: 0.045; } 50% { stroke-opacity: 1; stroke-width: 2.6; fill-opacity: 0.085; } }

  /* data particles travelling along the numbered flows */
  #dia .flowline { fill: none; stroke: var(--fc); stroke-width: 3.6; stroke-linecap: round; stroke-dasharray: 0.1 12.9; opacity: 0; pointer-events: none; }
  #dia .step.current .flowline { animation: march 0.9s linear infinite, fade 0.4s ease-out 0.75s both; }
  #dia.all .flowline { opacity: 1; animation: march 0.9s linear infinite; }
  @keyframes march { to { stroke-dashoffset: -13; } }

  #dia .ring { opacity: 0; transform-box: fill-box; transform-origin: center; pointer-events: none; }
  #dia .step.current .ring { animation: ring 2.2s ease-out 0.9s infinite; }
  #dia.all .ring { animation: ring 2.8s ease-out calc(var(--n) * 0.4s) infinite; }
  @keyframes ring { 0% { opacity: 0.75; transform: scale(1); } 100% { opacity: 0; transform: scale(2.7); } }

  #cap.swap { animation: capin 0.6s ease-out both; }
  @keyframes capin { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: none; } }

  /* ---------- hover effects on every box ---------- */
  #dia .node, #dia .panel { cursor: pointer; transition: transform 0.32s cubic-bezier(.2, .8, .2, 1), filter 0.32s ease; }
  #dia .node:hover, #dia .panel:hover { transform: translateY(-4px); filter: drop-shadow(0 14px 16px color-mix(in srgb, var(--c) 38%, transparent)); }
  #dia .node .ncard { transition: fill 0.25s ease; }
  #dia .node:hover .ncard { fill: color-mix(in srgb, var(--c) 6%, #FFFFFF); }
  #dia .node .acc, #dia .panel .acc { transition: stroke-opacity 0.25s ease, stroke-width 0.25s ease; }
  #dia .node:hover .acc { stroke-opacity: 1; stroke-width: 2.2; }
  #dia .panel:hover .acc { stroke-opacity: 0.9; }
  #dia .node .tg { transform-box: fill-box; transform-origin: center; transition: transform 0.4s cubic-bezier(.3, 1.7, .5, 1); }
  #dia .node:hover .tg { transform: scale(1.14) rotate(-5deg); }
  #dia .node .nbar { transition: filter 0.25s ease; }
  #dia .node:hover .nbar { filter: brightness(1.25); }
  #dia .cyl .lid { transition: fill 0.25s ease; }
  #dia .cyl:hover .lid { fill: #DE9A48; }
  #dia .ztab { cursor: pointer; transition: filter 0.25s ease; }
  #dia .ztab:hover { filter: brightness(1.18) drop-shadow(0 4px 8px color-mix(in srgb, var(--zc) 50%, transparent)); }
  #dia .pill { transition: transform 0.25s ease, filter 0.25s ease; }
  #dia .pill rect { transition: fill-opacity 0.25s ease; }
  #dia .pill:hover { transform: translateY(-2px); }
  #dia .pill:hover rect { fill-opacity: 0.22; }
  #dia .pill.hl:hover { filter: drop-shadow(0 0 10px rgba(34, 197, 94, 0.9)); }
  #dia .pill.hl:hover rect { fill-opacity: 1; }

  /* ---------- presenter bar ---------- */
  .bar {
    width: max(var(--sw), min(calc(100vw - 32px), 980px));
    background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
    padding: 14px 18px 16px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 20px 50px -20px rgba(0, 0, 0, 0.6);
  }
  .segs { display: flex; gap: 6px; margin-bottom: 14px; }
  .seg {
    position: relative; flex: 1; height: 6px; border: 0; padding: 0; border-radius: 99px; cursor: pointer;
    background: rgba(255, 255, 255, 0.12); transition: height 0.2s ease, background 0.2s ease;
  }
  .seg:hover { height: 10px; background: rgba(255, 255, 255, 0.22); }
  .seg i { position: absolute; inset: 0; width: 0; border-radius: inherit; background: var(--sc); }
  .seg.done i, .seg.cur i { width: 100%; }
  .seg.cur i { box-shadow: 0 0 12px var(--sc); }
  .seg.cur.timing i { width: 0; animation: fill var(--dur) linear forwards; }
  @keyframes fill { to { width: 100%; } }
  .seg::after {
    content: attr(data-label); position: absolute; left: 50%; bottom: 16px; transform: translate(-50%, 4px);
    white-space: nowrap; font-size: 11.5px; font-weight: 600; color: #fff; background: rgba(2, 6, 23, 0.92);
    border: 1px solid var(--line); padding: 5px 9px; border-radius: 8px; opacity: 0; pointer-events: none;
    transition: opacity 0.18s ease, transform 0.18s ease;
  }
  .seg:hover::after { opacity: 1; transform: translate(-50%, 0); }

  .row { display: grid; grid-template-columns: auto 1fr auto; gap: 18px; align-items: center; }
  .chip {
    width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center;
    font-size: 20px; font-weight: 800; color: #fff; letter-spacing: -0.5px;
    background: linear-gradient(145deg, color-mix(in srgb, var(--c) 100%, #fff 18%), color-mix(in srgb, var(--c) 80%, #000 25%));
    box-shadow: 0 10px 28px -8px var(--c), inset 0 1px 0 rgba(255, 255, 255, 0.25);
  }
  .kick { font-size: 11.5px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: color-mix(in srgb, var(--c) 45%, #fff); }
  .ttl { font-size: 21px; font-weight: 800; letter-spacing: -0.3px; margin: 2px 0 4px; }
  .desc { font-size: 14px; line-height: 1.5; color: var(--muted); max-width: 900px; }
  .txt.swap { animation: txtin 0.5s ease-out both; }
  @keyframes txtin { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .ctl { display: flex; gap: 8px; align-items: center; }
  .btn {
    height: 44px; min-width: 44px; padding: 0 14px; border-radius: 12px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    font: 600 13.5px Inter, system-ui, sans-serif; color: #E8EEF8;
    background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.14);
    transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.25s ease, border-color 0.25s ease;
  }
  .btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .btn:hover { transform: translateY(-2px); background: rgba(255, 255, 255, 0.12); border-color: color-mix(in srgb, var(--c) 70%, #fff); box-shadow: 0 10px 26px -8px var(--c); }
  .btn:active { transform: translateY(0) scale(0.96); }
  .btn:focus-visible { outline: 2px solid color-mix(in srgb, var(--c) 60%, #fff); outline-offset: 2px; }
  .btn.primary { background: linear-gradient(145deg, color-mix(in srgb, var(--c) 100%, #fff 12%), color-mix(in srgb, var(--c) 80%, #000 20%)); border-color: transparent; }
  .btn.primary:hover { box-shadow: 0 12px 30px -6px var(--c); }
  .btn[disabled] { opacity: 0.35; pointer-events: none; }
  .hint { font-size: 11.5px; color: #7D8DA6; margin-top: 10px; text-align: right; }
  .hint kbd { font: 600 10.5px Inter, sans-serif; padding: 2px 6px; border-radius: 5px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.05); color: #C9D5E6; }

  /* ---------- tooltip ---------- */
  .tip {
    position: fixed; left: 0; top: 0; z-index: 20; pointer-events: none; max-width: 320px;
    background: rgba(2, 6, 23, 0.92); border: 1px solid var(--line); border-left: 3px solid var(--tc, #22C55E);
    border-radius: 12px; padding: 10px 13px; box-shadow: 0 18px 40px -12px rgba(0, 0, 0, 0.7);
    opacity: 0; transform: translateY(6px); transition: opacity 0.16s ease, transform 0.16s ease;
  }
  .tip.on { opacity: 1; transform: none; }
  .tip .z { font-size: 10.5px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--tc); }
  .tip .t { font-size: 15px; font-weight: 700; margin: 3px 0 5px; color: #fff; }
  .tip .l { font-size: 12.5px; color: #B6C4D8; line-height: 1.5; }
  .tip .go { font-size: 11px; color: #7D8DA6; margin-top: 6px; }

  @media (max-width: 760px) {
    :root { --sw: calc(100vw - 16px); }
    .app { padding: 8px; justify-content: flex-start; }
    .row { grid-template-columns: auto 1fr; }
    .ctl { grid-column: 1 / -1; justify-content: space-between; }
    .ctl .lbltxt { display: none; }
    .hint { display: none; }
    .ttl { font-size: 18px; }
    .desc { font-size: 13px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #dia *, .txt, .seg i { animation: none !important; transition: none !important; }
    #dia .step.current .flowline { opacity: 1; }
  }

  /* video / frame export: diagram only, edge to edge */
  body.export { background: #F6F8FB; }
  .export .app { padding: 0; gap: 0; justify-content: flex-start; }
  .export .stage { width: 100vw; }
  .export .stage::before, .export .bar, .export .tip { display: none; }
  .export .card { border-radius: 0; box-shadow: none; }

  :fullscreen .app { background: var(--bg); }
</style>
</head>

<script>
(function () {
  var STEPS = [{"t": "Overview", "k": "The map", "c": "#16407A", "cap": "Solution architecture  ·  Playwright for Java + Cucumber BDD  ·  runtime Oracle test data  ·  Jenkins on OpenShift", "d": "Eight layers, seven numbered flows. Each step lights up one layer and the flow that reaches it, so you can follow a single test run from commit to dashboard."}, {"t": "Source & CI/CD", "k": "Zone A", "c": "#0E7490", "cap": "Zone A  ·  Code is pushed to a GitLab feature branch and Jenkins builds it in an OpenShift pod", "d": "The engineer writes feature files, step code and Object Repository keys and raises a merge request in GitLab. Jenkins Multibranch builds the branch in an OpenShift pod running the Playwright image. Credentials come from an OpenShift secret at run time, never from Git."}, {"t": "Test Orchestration", "k": "Flow 1  ·  Zone B", "c": "#1D4ED8", "cap": "Flow 1  ·  run-tests.sh starts Maven: TestRunner, Hooks and Cucumber 7 load the feature packs", "d": "run-tests.sh starts Maven. TestRunner reads ExecutionControl.xlsx to choose the test cases, Hooks load the TestData row and handle retries and soft asserts, and Cucumber 7 parses the BISS iNet, Staff and ENTS feature packs."}, {"t": "Test Logic & Core", "k": "Flow 2  ·  Zone C", "c": "#6D28D9", "cap": "Flow 2  ·  Each Gherkin step binds to a step class, and every UI action goes through iAction", "d": "Each Gherkin line binds to a Java step in the BISS, Staff or ENTS step classes. Every UI action goes through one entry point, the iAction engine, which reads XPaths from the Object Repository, resolves TD: values and logs the step."}, {"t": "Playwright Engine", "k": "Flow 3  ·  Zone D", "c": "#15803D", "cap": "Flow 3  ·  iAction drives Playwright for Java: auto-waiting locators on a per-thread Chromium page", "d": "iAction calls Playwright for Java. PlaywrightFactory gives each thread its own Browser, Context and Page on Chromium. Auto-waiting locators, network waits and Angular Material handling keep the tests stable; tracing and page listeners capture what happened."}, {"t": "Applications Under Test", "k": "Flow 4  ·  Zone E", "c": "#334155", "cap": "Flow 4  ·  Chromium signs in through Keycloak and drives the BISS iNet, Staff and ENTS portals", "d": "Chromium reaches the real portals over HTTPS. Keycloak handles agent, individual, staff and ETF partner logins, then the tests drive the BISS iNet, Staff and ENTS Angular apps on SIT or CENTEST."}, {"t": "Test Data Layer", "k": "Flow 5  ·  Zone F", "c": "#B45309", "cap": "Flow 5  ·  Steps ask the data layer for herds and logins at run time, reserved through the Vault", "d": "Steps do not hard-code herds. They ask the data layer at run time: DBRouter runs the labelled query, DataHarvester fills the pools, and the Test Data Vault moves each herd from AVAILABLE to RESERVED to USED or BAD so parallel runs never collide."}, {"t": "Oracle Data Sources", "k": "Flow 6  ·  Zone G", "c": "#92400E", "cap": "Flow 6  ·  DBRouter runs labelled, read-only SQL against three Oracle schemas on CENTEST", "d": "DBRouter connects over JDBC to three Oracle schemas: BISS_DATA, BISS_INET and ENTS_DATA. CENTEST is a weekly-refreshed copy of production, so every query is read-only."}, {"t": "Reporting & Evidence", "k": "Flow 7  ·  Zone H", "c": "#BE123C", "cap": "Flow 7  ·  Timings, traces and results become team and stakeholder dashboards in Jenkins", "d": "Step timings, DB query times and results flow into ExecutionMetrics. DashboardReport builds the team HTML report and a stakeholder PDF with herds masked, published on every Jenkins build."}, {"t": "Resilience & Governance", "k": "Built in", "c": "#B42318", "cap": "Built in  ·  Self-healing patterns keep runs moving; governance keeps farmer data and secrets safe", "d": "Self-healing patterns recover from data and UI surprises without human help. Governance rules keep every change reviewed and keep credentials and farmer data out of Git and out of stakeholder reports."}, {"t": "The Complete Flow", "k": "End to end", "c": "#15803D", "cap": "End to end  ·  Flows 1 → 7, from a commit to a published dashboard", "d": "The whole picture: a commit triggers Jenkins, Cucumber binds the steps, iAction drives Playwright against the portals, runtime data comes from Oracle through the Vault, and the evidence ends up on the dashboard."}];
  var N = STEPS.length;
  var DUR = 7000;
  var svg = document.getElementById("dia");
  var groups = Array.prototype.slice.call(svg.querySelectorAll(".step"));
  var cap = document.getElementById("cap");
  var segs = document.getElementById("segs");
  var txt = document.getElementById("txt");
  var cur = -1, timer = null, playing = false;

  if (new URLSearchParams(location.search).has("export")) document.body.classList.add("export");

  STEPS.forEach(function (s, i) {
    var b = document.createElement("button");
    b.className = "seg";
    b.setAttribute("data-label", (i + 1) + ". " + s.t);
    b.setAttribute("aria-label", "Go to step " + (i + 1) + ": " + s.t);
    b.style.setProperty("--sc", s.c);
    b.appendChild(document.createElement("i"));
    b.addEventListener("click", function () { go(i); });
    segs.appendChild(b);
  });
  var segEls = Array.prototype.slice.call(segs.children);

  function restart(el, cls) {
    el.classList.remove(cls);
    void el.getBoundingClientRect();
    el.classList.add(cls);
  }

  function setStates(k) {
    svg.classList.toggle("all", k === N - 1);
    var target = null;
    groups.forEach(function (g) {
      var s = +g.getAttribute("data-step"), st;
      if (k === N - 1) st = s === 0 ? "future" : "shown";
      else if (s === 0) st = k === 0 ? "current" : "future";
      else st = s === k ? "current" : (s < k ? "past" : "future");
      if (st === "current") target = g;
      else g.setAttribute("class", "step " + st);
    });
    if (target) {
      target.setAttribute("class", "step");
      void svg.getBoundingClientRect();
      target.setAttribute("class", "step current");
    }
  }

  function go(k) {
    k = Math.max(0, Math.min(N - 1, k));
    var s = STEPS[k];
    cur = k;
    setStates(k);
    cap.textContent = s.cap;
    restart(cap, "swap");
    document.body.style.setProperty("--c", s.c);
    document.getElementById("chip").textContent = (k + 1 < 10 ? "0" : "") + (k + 1);
    document.getElementById("kick").textContent = "Step " + (k + 1) + " of " + N + "  ·  " + s.k;
    document.getElementById("ttl").textContent = s.t;
    document.getElementById("desc").textContent = s.d;
    restart(txt, "swap");
    segEls.forEach(function (e, i) {
      e.classList.toggle("done", i < k);
      e.classList.toggle("cur", i === k);
      e.classList.remove("timing");
    });
    document.getElementById("prev").disabled = k === 0;
    document.getElementById("next").disabled = k === N - 1;
    schedule();
  }

  function schedule() {
    clearTimeout(timer);
    if (!playing) return;
    if (cur >= N - 1) { setPlaying(false); return; }
    var seg = segEls[cur];
    seg.style.setProperty("--dur", DUR + "ms");
    restart(seg, "timing");
    timer = setTimeout(function () { go(cur + 1); }, DUR);
  }

  function setPlaying(on) {
    playing = on;
    document.getElementById("playTxt").textContent = on ? "Pause" : "Auto-play";
    document.getElementById("playIco").innerHTML = on ? '<path d="M8 5v14M16 5v14"/>' : '<path d="M7 4.5l12 7.5-12 7.5z"/>';
    if (on && cur >= N - 1) { go(0); return; }
    if (!on) { clearTimeout(timer); segEls.forEach(function (e) { e.classList.remove("timing"); }); }
    else schedule();
  }

  function fullscreen() {
    if (!document.fullscreenElement) { (document.documentElement.requestFullscreen || function () {}).call(document.documentElement); }
    else if (document.exitFullscreen) { document.exitFullscreen(); }
  }

  document.getElementById("prev").addEventListener("click", function () { go(cur - 1); });
  document.getElementById("next").addEventListener("click", function () { go(cur + 1); });
  document.getElementById("play").addEventListener("click", function () { setPlaying(!playing); });
  document.getElementById("allBtn").addEventListener("click", function () { go(N - 1); });
  document.getElementById("fs").addEventListener("click", fullscreen);

  document.addEventListener("keydown", function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    var k = e.key;
    if (k === "ArrowRight" || k === " " || k === "PageDown" || k === "Enter") { e.preventDefault(); go(cur + 1); }
    else if (k === "ArrowLeft" || k === "PageUp" || k === "Backspace") { e.preventDefault(); go(cur - 1); }
    else if (k === "Home") { go(0); }
    else if (k === "End") { go(N - 1); }
    else if (k === "p" || k === "P") { setPlaying(!playing); }
    else if (k === "f" || k === "F") { fullscreen(); }
  });

  // swipe on phones and tablets
  var tx = null;
  svg.addEventListener("touchstart", function (e) { tx = e.touches[0].clientX; }, { passive: true });
  svg.addEventListener("touchend", function (e) {
    if (tx === null) return;

    if (Math.abs(dx) > 50) go(cur + (dx < 0 ? 1 : -1));
  });

  // tooltip + click to jump
  var tip = document.getElementById("tip");
  svg.addEventListener("mousemove", function (e) {
    var n = e.target.closest(".node");
    if (!n || n.closest(".step.future")) { tip.classList.remove("on"); return; }
    var col = getComputedStyle(n).getPropertyValue("--c").trim();
    tip.style.setProperty("--tc", col);
    var lines = (n.getAttribute("data-l") || "").split(" | ").filter(Boolean);
    tip.innerHTML = "";
    var z = document.createElement("div"); z.className = "z"; z.textContent = n.getAttribute("data-z"); tip.appendChild(z);
    var t = document.createElement("div"); t.className = "t"; t.textContent = n.getAttribute("data-t"); tip.appendChild(t);
    lines.forEach(function (l) { var d = document.createElement("div"); d.className = "l"; d.textContent = l; tip.appendChild(d); });
    var s = +n.getAttribute("data-s");
    if (s !== cur) { var g = document.createElement("div"); g.className = "go"; g.textContent = "Click to jump to this layer"; tip.appendChild(g); }
    var w = tip.offsetWidth, h = tip.offsetHeight;
    var x = Math.min(window.innerWidth - w - 12, e.clientX + 16);
    var y = e.clientY + 18 + h > window.innerHeight ? e.clientY - h - 14 : e.clientY + 18;
    tip.style.left = x + "px"; tip.style.top = y + "px";
    tip.classList.add("on");
  });
  svg.addEventListener("mouseleave", function () { tip.classList.remove("on"); });
  svg.addEventListener("click", function (e) {
    var n = e.target.closest(".node, .ztab, .panel");
    if (!n) return;
    var g = n.closest(".step");
    if (!g || g.classList.contains("future")) return;
    var s = +g.getAttribute("data-step");
    if (s !== cur) go(s);
  });

  // hooks used to export the video frames
  window.__go = go;
  window.__seek = function (ms) {
    document.getAnimations().forEach(function (a) { a.pause(); a.currentTime = ms; });
  };

  go(0);
})();
</script>
</body>
</html>
